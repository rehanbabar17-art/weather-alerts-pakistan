name: Weather Forecast & Alerts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  weather-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "/repos/${{ github.repository }}/actions/workflows/daily_forecast.yml/enable" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: last_state.json
          key: weather-state-${{ github.run_number }}
          restore-keys: weather-state-

      - name: Fetch forecast and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOCATIONS_JSON: ${{ secrets.LOCATIONS_JSON }}
        run: python weather_fetcher.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: last_state.json
          key: weather-state-${{ github.run_number }}
